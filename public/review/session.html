<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOTY session · your calls</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&family=Inter:wght@400;600&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{--pine:#022822;--canvas:#F5F6E1;--sun:#FFB413;--wood:#006C4C;--mint:#ACFFCC;--line:#DCE0CC}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--pine);font:17px/1.6 Inter,system-ui,sans-serif}
header{background:var(--pine);color:var(--canvas);padding:28px 32px 20px;position:sticky;top:0;z-index:5}
h1{font:400 30px/1.2 'Libre Baskerville',Georgia,serif;margin:0 0 6px}h1 em{color:var(--sun)}
.meta{font:13px 'DM Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.tabs button,.secnav button{font:13px 'DM Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--canvas);background:transparent;color:var(--canvas);padding:8px 14px;cursor:pointer}
.tabs button.on{background:var(--sun);border-color:var(--sun);color:var(--pine)}
.secnav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.secnav button{font-size:12px;padding:5px 10px}.secnav button.on{background:var(--canvas);color:var(--pine)}.secnav button.done{border-color:var(--mint);color:var(--mint)}.secnav button.on.done{color:var(--pine)}
main{max-width:860px;margin:0 auto;padding:28px 24px 80px}
h2{font:400 26px/1.25 'Libre Baskerville',Georgia,serif;margin:8px 0 20px}
.q{background:#fff;border:1px solid var(--line);margin:0 0 18px;padding:22px 24px}
.q.answered{border-left:6px solid var(--wood)}.q.settled{opacity:.75}
.qid{font:13px 'DM Mono',monospace;letter-spacing:1.5px;color:var(--wood);text-transform:uppercase}
.qt{font:400 21px/1.35 'Libre Baskerville',Georgia,serif;margin:4px 0 10px}
.read{background:var(--canvas);padding:12px 14px;margin:12px 0;border-left:3px solid var(--sun)}.read b{font:12px 'DM Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;display:block;color:#8A5F00}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btns button{font:13px 'DM Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;border:1px solid var(--pine);background:#fff;color:var(--pine);padding:10px 14px;cursor:pointer}
.btns button.on{background:var(--pine);color:var(--sun)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);padding:10px 12px;font:16px/1.5 Inter,sans-serif;color:var(--pine);resize:vertical}
.row{display:flex;gap:10px;align-items:center;margin-top:8px;font:12px 'DM Mono',monospace;letter-spacing:1px;color:#5a6b66;text-transform:uppercase}
.mic{border:1px solid var(--pine);background:#fff;padding:8px 12px;cursor:pointer;font:12px 'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase}.mic.rec{background:#B03A0B;color:#fff;border-color:#B03A0B}
.donebar{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px;flex-wrap:wrap}
.big{font:14px 'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;background:var(--sun);color:var(--pine);border:0;padding:16px 24px;cursor:pointer}
.tip{font-size:14px;color:#5a6b66}
</style></head><body>
<header><h1>Your calls, <em>one section at a time</em></h1><div class="meta">Wed 25 Nov · DOTY growth and app sessions · answers save as you go</div>
<div class="tabs" id="tabs"></div><div class="secnav" id="secnav"></div></header>
<main id="main"></main>
<script>
const DATA={"growth": [{"n": "1", "t": "The results page (20 min, first)", "qs": [{"id": "1.1", "q": "Ship the v3 results page and relaunch today?", "b": "v3 adds three cards picked for his lowest section inside the offer, a second full offer box after the stakes, and a sticky buy bar on phones.", "r": "ship it after your review, fold in the guarantee and gift calls below, turn ads back on today, and watch the PostHog section markers for a week."}, {"id": "1.2", "q": "A named guarantee with a condition?", "b": "Hormozi: a better guarantee alone can lift conversion 2 to 4x. Draft: \"Play one card the night it happens. If it doesn't help, we refund you.\"", "r": "yes, worded through the voice check, kept short as you asked on 13 Nov."}, {"id": "1.3", "q": "Name and price the gift on the page?", "b": "Hormozi wants every bonus named with a real price.", "r": "yes for 52 Saturday Mornings, at a price you're comfortable defending."}, {"id": "1.4", "q": "Proof before spend.", "b": "We have no buyer reviews yet, and Hormozi says proof comes before spend.", "r": "a personal ask for a review to every buyer from the relaunch, and Dad Shift free to two or three dads you trust in exchange for honest feedback and a review."}]}, {"n": "2", "t": "Paid ads (25 min)", "qs": [{"id": "2.1", "q": "What do we optimize for when ads come back?", "b": "On 22 Nov we suggested scorecard finishes. Sam's lead gen lesson changed our read: optimizing for leads teaches Meta to find dads who finish the scorecard cheaply and don't buy, which matches our 23 finishers and 0 orders.", "r": "optimize for purchase, with the fixed results page live first. It fits your 20 Nov buyers only rule."}, {"id": "2.2", "q": "Broad or layered targeting?", "b": "Sam and Meta in 2026: broad wins once the creative does the targeting. Your 20 Nov rule: layered.", "r": "broad (US, age, Advantage+), with the call out in the creative (\"Dads of kids 3 to 14\")."}, {"id": "2.3", "q": "Budget and the kill rule.", "b": "Hormozi: let a test ad spend up to twice what a buyer pays in his first 30 days, about $58 to $75, then cut it.", "r": "$50 a day, that kill rule, and one creative test per Monday logged in one place."}, {"id": "2.4", "q": "Creative volume.", "b": "Hormozi: about 10 bodies and 30 hooks a week. Sam: more creative beats more targeting.", "r": "start at 3 bodies and 10 hooks a week, all from the existing photos and the audio cards."}, {"id": "2.5", "q": "The scaling trigger.", "b": "You said spend much more once we hit even 2x.", "r": "raise in steps of about 20% every few days, because big jumps reset learning."}, {"id": "2.6", "q": "Facebook placements.", "b": "You opened Facebook on 23 Nov if the experts back it. They do: Sam runs every Meta placement (Facebook, Instagram, Reels, Stories) and cuts one only with clear data, and Hormozi rates Facebook A tier for dads 30 to 45.", "r": "all placements from the relaunch, then check the placement breakdown weekly. The placement check (Tue 24 Nov): both past campaigns ran on Instagram only, so we have no Facebook numbers yet. Instagram Feed brought 16 of the 22 leads at $3.39 each, under the $3.96 average. The buyers campaign had no purchases on any placement. Facebook starts from zero at the relaunch, which is one more reason to let Meta test it."}]}, {"n": "3", "t": "Social (25 min)", "qs": [{"id": "3.1", "q": "Which face carries the brand?", "b": "You set no faces for now. The brands that grew that way used a character (Duolingo's owl, Duluth's cartoons), real people as recurring ambassadors (YETI), or a show format with no host (Liquid Death).", "r": "start with real dad moments told in our voice, and test an animated DOTY character with a few hundred dollars before building it."}, {"id": "3.2", "q": "Our first two series.", "b": "Karten: a series gives people a reason to come back. Candidates: \"The minute after\" (one Dad Shift moment a week) and 52 Saturday Mornings week by week.", "r": "both, starting the first week of December."}, {"id": "3.3", "q": "Cadence.", "b": "Hormozi says volume, up to two a day. Duolingo posts three to five a week, only with a real idea.", "r": "one a day on Instagram, and skip a day before posting a weak one."}, {"id": "3.4", "q": "Give and ask.", "b": "Hormozi: give in public, ask in ads and email, and give until they ask.", "r": "posts give, the bio and stories ask, and one post in ten names the Dad Score."}, {"id": "3.5", "q": "Keyword DMs.", "b": "ManyChat style: a dad comments a word and gets the free card. Jake says never automate the conversation itself.", "r": "automate only the free card; every reply after it is ours."}, {"id": "3.6", "q": "Pre scheduling.", "b": "Hormozi says don't pre schedule. Metricool exists to pre schedule.", "r": "schedule the series, post the reactive ones by hand."}]}, {"n": "4", "t": "Email (15 min)", "qs": [{"id": "4.1", "q": "Send Dean Jackson's nine word email to the 23 dads?", "b": "\"Are you still looking to stop yelling at your kids?\" Plain text, from howdy@.", "r": "yes, this week, before Thanksgiving."}, {"id": "4.2", "q": "Plain text or images?", "b": "Your 18 Nov rule is images. Hormozi and Max lean plain text for inbox placement and replies.", "r": "test both on two halves of the list for the next four sends."}, {"id": "4.3", "q": "Cadence and the newsletter.", "b": "Max: about three a week to buyers and leads, each with one idea.", "r": "two a week through December, one value and one offer, the same series names as social."}, {"id": "4.4", "q": "Attio now or December?", "b": "Kit already holds the 23 dads tagged by score.", "r": "December, once there's a sales conversation to track."}]}, {"n": "5", "t": "Product and the money model (20 min)", "qs": [{"id": "5.1", "q": "The rung above $29.", "b": "Hormozi: each rung 5 to 10x the last, offered while he's still excited. Big Little Feelings sells its course for this pain at $99, so a $99 to $149 rung is a proven price. Candidates: a guided month for one hard season, The Reset at $149, a seasonal card pack, or the First Trip at $279.", "r": "The Reset or a guided month, offered on day 3 to 7 by email."}, {"id": "5.2", "q": "The rollover.", "b": "Credit his $29 toward the next rung.", "r": "yes."}, {"id": "5.3", "q": "Monthly membership and the 13 Dec app.", "b": "Open: price, what's inside, and billing every four weeks (8.3% more for the same work).", "r": "decide the price after the app session, bill every four weeks."}, {"id": "5.4", "q": "A high anchor on the page.", "b": "A father and kid weekend outdoors or Explorer, shown so the $29 looks easy.", "r": "wait until we have a real date and price to show."}, {"id": "5.5", "q": "Rule 111.", "b": "Hormozi: one product, one avatar, one channel until it works.", "r": "Dad Shift, dads of kids 3 to 14, Instagram, until orders come in; the app ships 13 Dec because it's already promised."}, {"id": "5.6", "q": "Product Bench.", "b": "Which product gets built next after the rung above $29.", "r": "whatever the 23 dads' answers point at; send them one question first."}]}, {"n": "6", "t": "December (15 min)", "qs": [{"id": "6.1", "q": "Advent calendar or 12 days of Christmas?", "b": "The 12 days run 13 to 24 Dec with the app.", "r": "12 days, one card or one Saturday morning a day, each day ending on the app or Dad Shift."}, {"id": "6.2", "q": "The Christmas gift play.", "b": "A buyer sends a Dad Shift gift card to a buddy, with the buddy's name on it.", "r": "yes, live by 10 Dec."}, {"id": "6.3", "q": "Whisper, tease, shout for the app on 13 Dec.", "b": "Whisper this week with behind the scenes of the build, tease the date from 1 Dec, shout from three days out.", "r": "yes, and run the same shape for every launch after it."}, {"id": "6.4", "q": "A December budget.", "b": "Nothing sets a total for the month yet: ads, the lawyer, app tools and AI, ScoreApp, Kit, Skool. About $188 went out with nothing back so far.", "r": "one number for December with ads as the biggest line, a ceiling until we hit 2x, and the Founder Dashboard tracks spend against it."}, {"id": "6.5", "q": "What goes live without your eyes.", "b": "Your Sunday approval covers week one; after that your review time is the bottleneck.", "r": "series posts and emails built from approved formats go out after the full voice check; anything new (a new offer, a new page, a new email type, any price) waits for you."}, {"id": "6.6", "q": "What runs while you're off.", "b": "", "r": "the two series, two emails a week and the ads at $50 a day, with a daily read sent to you and no budget changes without your word."}]}], "app": [{"n": "1", "t": "What the app is for", "qs": [{"id": "1.1", "q": "The one job.", "b": "Every great app has one job a user would miss. Duolingo is the daily lesson, Strava is the record of the run, Headspace is the session when you need it. September said the concierge (memory, logistics, the weekend sorted). Since then Dad Shift became the product dads actually buy.", "r": "the first job is help in the moment and a better week with your kids; the concierge grows in later. What's the one job in your words?"}, {"id": "1.2", "q": "Who it's for first.", "b": "Dads of kids 3 to 14, the same dad as the scorecard.", "r": "yes, and only him at launch. Moms and partners join later through sharing."}, {"id": "1.3", "q": "How it fits the pillars.", "b": "Masculinity is good (the dad who leads calmly), brotherhood uplifts (circles of dads), get outside (Saturdays).", "r": "all three in the first version, each with one feature, so the app feels like DOTY from day one."}]}, {"n": "2", "t": "Your feature list, sorted", "qs": [{"id": "2.1", "q": "What ships Dec 13?", "b": "Our read on a first cut: the Dad Score, the SOS button with Dad Shift inside, one daily action with a reminder, 52 Saturday Mornings week by week, and onboarding that knows each kid. Circles, the email reader, booking and the full concierge wait.", "r": ""}, {"id": "2.2", "q": "What's free forever?", "b": "Life360 writes a bill of rights for its free tier.", "r": "the Dad Score, the SOS button with a few cards, the daily action and 52 Saturday Mornings stay free forever."}, {"id": "2.3", "q": "Where's the paid line?", "b": "RevenueCat: free users should make real progress without reaching the full solution, and higher priced apps convert better.", "r": "the full card library and every new pack, the coach that remembers your family, and the circles are paid."}]}, {"n": "3", "t": "Money", "qs": [{"id": "3.1", "q": "Price.", "b": "Good Inside: about $23 to $28 a month, $84 a quarter, $279 a year. Dad apps: $5 to $16 a month.", "r": "decide between $14.99 a month (September's number) and a Good Inside level price after you see the paid line; our lean is higher, because higher priced apps convert better and the product is deeper than the dad apps."}, {"id": "3.2", "q": "Dad Shift buyers.", "b": "", "r": "everyone who bought Dad Shift gets the app's paid tier free for a period, as a thank you and a reverse trial."}, {"id": "3.3", "q": "Trial.", "b": "", "r": "a reverse trial of 7 days (premium, then free). Duolingo cut its trial from 14 to 7 days, and one app's reverse trial took freemium conversion from 0.4% to 4.5%."}, {"id": "3.4", "q": "Billing.", "b": "", "r": "lead with annual. Annual plans earn about twice what monthly does per install, renew at 83% once active against 39% for monthly, and keep 28% after a year against 8%. Offer monthly too, and a pause in place of cancel. Web billing through Stripe until the store versions."}]}, {"n": "4", "t": "The habit and the first session", "qs": [{"id": "4.1", "q": "The first session.", "b": "Headspace lets a new user feel the value before he trusts it.", "r": "onboarding asks about his kids, then plays one Dad Shift card for the moment he picks, then asks him to set a daily reminder."}, {"id": "4.2", "q": "The daily action.", "b": "", "r": "one 2 to 3 minute thing a day: a card, a question for dinner, or a Saturday plan to pick. Streak counts days he showed up; a missed day never resets his progress to zero (September's rule)."}, {"id": "4.2b", "q": "Reminders are a limited channel.", "b": "Duolingo set a \"protect the channel\" rule: more reminders needed strong proof and the CEO's yes.", "r": "one reminder a day at most, and you approve any increase."}, {"id": "4.3", "q": "Reminders on a web app.", "b": "On iPhone, push only works after he adds the app to his Home Screen and allows it, about five taps on iOS 26.", "r": "walk every dad through Add to Home Screen in onboarding, and run reminders by text and email too until the store versions ship. Do you want texts in the mix?"}]}, {"n": "5", "t": "The coach and the AI", "qs": [{"id": "5.1", "q": "An AI coach at launch?", "b": "Good Inside's GiGi is their headline feature.", "r": "yes, narrow at first: it answers in the DOTY voice from Dad Shift and the four moves, knows his kids' names and ages, and stays out of therapy."}, {"id": "5.2", "q": "Safety.", "b": "", "r": "September's minimum before launch: detect self harm, harm to a child and abuse; stop; show 988 and Childhelp; log it. A fixed message, never a generated one."}, {"id": "5.3", "q": "Cost.", "b": "September's ceiling was $3 a member a month.", "r": "small models by default, caps on heavy use, free users get a set number of coach questions."}]}, {"n": "6", "t": "Kids' data and the law", "qs": [{"id": "6.1", "q": "What we store about kids.", "b": "", "r": "first names, ages and his notes only; no photos of kids leave his device without his say; never sold, never used for ads, never used to train models."}, {"id": "6.2", "q": "Legal review.", "b": "Eighteen state chatbot laws were enacted across 2025 and 2026, and California's lets users sue.", "r": "a lawyer reviews the privacy policy, terms and the coach before Dec 13. Do you have one, or should we find one?"}]}, {"n": "7", "t": "Community", "qs": [{"id": "7.1", "q": "Circles at launch or later?", "b": "Strava: the community is the product, and Strava users open the app 35+ times a month. September: circles of twelve dads, no politics, no religion, moderated.", "r": "later, after the first 1,000 dads, because an empty room hurts more than no room. Challenges with a shared feed can come first."}, {"id": "7.2", "q": "Moderation.", "b": "", "r": "AI first pass plus one human, with the no politics, no religion rule written in."}]}, {"n": "8", "t": "Build and numbers", "qs": [{"id": "8.1", "q": "Lauren's time.", "b": "How many hours a week can she give through Dec 13?", "r": "the first cut in 2.1 needs her on the onboarding, the home screen and the SOS flow."}, {"id": "8.2", "q": "The numbers we watch.", "b": "", "r": "Duolingo's model from day one, every dad in one of seven states each day, and one number a team owns: dads who come back this week after last week. Duolingo found it moved daily users about 5x more than any other lever. Plus activation, free to paid and Dad Score retakes."}, {"id": "8.3", "q": "The store versions.", "b": "", "r": "D-U-N-S first, then native apps in January, mainly for push and the App Store's reach."}, {"id": "8.4", "q": "The technical calls under the app.", "b": "These need making before Thursday's build.", "r": "dads log in with email and a one tap link (no passwords); web payments run through Stripe, linked to the Dad Shift buyers already there; kids' data is stored encrypted in one place we control, with export and delete on request."}]}]};
const SETTLED={"6.1":"Settled Tue 24 Nov: the 12 days of Christmas, 13 to 24 Dec. Advent calendar next year."};
const KEY='doty-session-25nov';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let tab=S._tab||'growth',sec=S._sec||0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};window.__dotyAnswers=S}
function esc(t){return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
 const T=document.getElementById('tabs');T.innerHTML='';
 [['growth','Growth session'],['app','App session']].forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;if(k===tab)b.className='on';b.onclick=()=>{tab=k;sec=0;S._tab=tab;S._sec=0;save();render();scrollTo(0,0)};T.appendChild(b)});
 const secs=DATA[tab];const N=document.getElementById('secnav');N.innerHTML='';
 secs.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.n+'. '+s.t.replace(/\s*\(.*\)/,'');let c=[];if(i===sec)c.push('on');if(S['done:'+tab+':'+s.n])c.push('done');b.className=c.join(' ');b.onclick=()=>{sec=i;S._sec=i;save();render();scrollTo(0,0)};N.appendChild(b)});
 const s=secs[sec];const M=document.getElementById('main');
 let h='<h2>'+esc(s.n)+'. '+esc(s.t)+'</h2>';
 s.qs.forEach(q=>{const k=tab+':'+q.id,a=S[k]||{};const st=tab==='growth'&&SETTLED[q.id];
  h+='<div class="q'+(a.pick||a.note?' answered':'')+(st?' settled':'')+'" id="q-'+q.id.replace('.','-')+'"><div class="qid">'+esc(q.id)+'</div><div class="qt">'+esc(q.q)+'</div><div>'+esc(q.b)+'</div>';
  if(q.r)h+='<div class="read"><b>Our read</b>'+esc(q.r)+'</div>';
  if(st){h+='<div class="read"><b>Already settled</b>'+esc(st)+'</div></div>';return}
  h+='<div class="btns">'+['Yes to our read','No','Let\'s talk'].map(p=>'<button data-k="'+k+'" data-p="'+p+'" class="'+(a.pick===p?'on':'')+'">'+p+'</button>').join('')+'</div>';
  h+='<textarea data-k="'+k+'" placeholder="Your words. Type, or tap Speak and talk.">'+esc(a.note)+'</textarea>';
  h+='<div class="row"><button class="mic" data-k="'+k+'">Speak</button><span id="st-'+k.replace(/[:.]/g,'-')+'">'+(a.t?'Saved '+a.t:'')+'</span></div></div>'});
 const dk='done:'+tab+':'+s.n;
 h+='<div class="donebar"><span class="tip">When this section is done, tap the button and tell Claude in chat: "next".</span><button class="big" id="done">'+(S[dk]?'Section done ✓':'Done with this section')+'</button></div>';
 M.innerHTML=h;
 M.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;S[k]=S[k]||{};S[k].pick=S[k].pick===b.dataset.p?'':b.dataset.p;stamp(k);render()});
 M.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{const k=t.dataset.k;S[k]=S[k]||{};S[k].note=t.value;stamp(k,true)});
 M.querySelectorAll('.mic').forEach(m=>m.onclick=()=>dictate(m));
 document.getElementById('done').onclick=()=>{S[dk]=new Date().toLocaleTimeString();save();render()};
}
function stamp(k,quiet){S[k].t=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});save();const e=document.getElementById('st-'+k.replace(/[:.]/g,'-'));if(e)e.textContent='Saved '+S[k].t}
let rec=null;
function dictate(btn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const k=btn.dataset.k;const ta=document.querySelector('textarea[data-k="'+k+'"]');
 if(!SR){ta.focus();btn.textContent='Use Mac dictation: press Fn twice';return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=false;btn.classList.add('rec');btn.textContent='Listening, tap to stop';
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){ta.value=(ta.value?ta.value+' ':'')+e.results[i][0].transcript.trim();S[k]=S[k]||{};S[k].note=ta.value;stamp(k)}}};
 rec.onerror=()=>{btn.textContent='Mic not available here: press Fn twice to dictate'};
 rec.onend=()=>{rec=null;btn.classList.remove('rec');if(btn.textContent.startsWith('Listening'))btn.textContent='Speak'};
 rec.start();
}
window.__dotyAnswers=S;render();
</script></body></html>
