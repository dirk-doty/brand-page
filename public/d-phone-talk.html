<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#022822">
<title>The Phone Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/images/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dad Shift">
<link rel="icon" type="image/svg+xml" href="/images/mono-pine.svg">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#022822; --canvas:#F5F6E1; --sunrise:#FFB413; --campfire:#FF6B01;
  --trail:#006C4C; --meadow:#40CF77; --mist:#ACFFCC; --sand:#FFDD68;
  --surface:#022822; --raised:#0D3E36; --ink:#F5F6E1; --ink-2:rgba(245,246,225,.80); --ink-3:rgba(245,246,225,.68);
  --border:rgba(245,246,225,.16); --border-strong:rgba(245,246,225,.34); --accent:#FFB413; --eyebrow:#FF8A3D;
  --serif:"Libre Baskerville",Georgia,serif; --sans:"Inter",-apple-system,Helvetica,Arial,sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--pine);color:var(--canvas);font-family:var(--sans);overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 18px 10px}
.brand{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.count{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* progress */
.dots{display:flex;gap:5px;padding:0 18px 8px}
.dots i{flex:1;height:3px;border-radius:0;background:var(--border);transition:background .25s}
.dots i.on{background:var(--sunrise)}
.dots i.done{background:rgba(255,180,19,.45)}

/* stage */
.stage{position:relative;flex:1;overflow:hidden}
.track{position:absolute;inset:0;display:flex;transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
.track.drag{transition:none}
.card{flex:0 0 100%;height:100%;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex}
.inner{flex:1;background:var(--raised);color:var(--ink);border:1px solid var(--border);border-radius:0;padding:28px 24px 24px;display:flex;flex-direction:column;overflow:auto}
.inner.pine{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--eyebrow);margin:0 0 14px}
.inner.pine .kicker{color:var(--accent)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(24px,6.4vw,32px);line-height:1.18;margin:0 0 16px;letter-spacing:-.005em;color:var(--ink);text-wrap:balance}
h1.big{font-size:clamp(30px,8.4vw,40px);margin-top:auto}
p{font-size:clamp(16px,4.3vw,18px);line-height:1.5;margin:0 0 14px;color:var(--ink-2)}
p:last-child{margin-bottom:0}
.say{margin:18px 0 0;padding:16px 18px;border:1px solid var(--border);font-family:var(--serif);font-style:italic;font-size:clamp(17px,4.6vw,19px);line-height:1.45;color:var(--ink)}

.not{margin:14px 0 0;padding:14px 18px;border:1px solid var(--border);color:var(--ink-3);font-size:15px;line-height:1.45}
.not b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.move{margin-top:auto;padding-top:18px;border-top:1px solid var(--border)}
.move b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--meadow);margin-bottom:6px}
.move span{font-family:var(--serif);font-size:clamp(17px,4.6vw,20px);line-height:1.4}
.hint{margin-top:auto;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding-top:14px}

/* audio */
.audio{margin-top:auto}
.play{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--sunrise);color:var(--pine);border-radius:0;min-height:48px;padding:0 18px;font:500 15px var(--sans);cursor:pointer}
.play .ico{width:28px;height:28px;border-radius:999px;background:var(--pine);display:grid;place-items:center;flex:0 0 28px}
.play .ico svg{width:14px;height:14px;fill:var(--sunrise);margin-left:2px}
.play.playing .ico svg{margin-left:0}
.aprog{height:3px;border-radius:0;background:var(--border);margin:14px 0 0;overflow:hidden}
.aprog i{display:block;height:100%;width:0;background:var(--sunrise)}
.atime{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}

.card-audio{margin-top:18px}.card-audio .play{background:var(--sunrise);color:var(--pine)}.card-audio .play .ico{background:var(--pine)}.card-audio .play .ico svg{fill:var(--sunrise)}.card-audio .aprog{background:var(--border)}.card-audio .aprog i{background:var(--accent)}.card-audio .atime{color:var(--ink-3)}
.src{margin-top:14px;font-size:13px;color:var(--ink-3)}.src summary{cursor:pointer;color:var(--accent);font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.src p{font-size:13px;line-height:1.45;margin:8px 0 0;color:var(--ink-3)}
/* links / buttons */
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;text-align:center;text-decoration:none;border-radius:0;padding:0 18px;font:500 15px var(--sans);margin-top:10px}
.btn.gold{background:var(--sunrise);color:var(--pine)}
.btn.line{border:1px solid var(--border-strong);color:var(--ink)}
.mark{width:72px;height:auto;margin:0 0 18px;display:block}

/* nav */
.nav{display:flex;gap:10px;padding:0 16px calc(env(safe-area-inset-bottom) + 14px)}
.nav button{flex:1;border:1px solid var(--border-strong);border-radius:0;min-height:48px;padding:0 14px;font:500 15px var(--sans);cursor:pointer;background:transparent;color:var(--ink)}
.nav button.next{background:var(--sunrise);border-color:var(--sunrise);color:var(--pine)}
.nav button:disabled{opacity:.3}
@media (min-width:640px){
  body{align-items:center}
  .bar,.dots,.stage,.nav{width:430px}
  .stage{flex:0 0 auto;height:min(760px,calc(100dvh - 150px))}
}
@media (min-width:1024px){
  .bar,.dots,.stage,.nav{width:540px}
  .stage{height:min(820px,calc(100dvh - 150px))}
  h1{font-size:34px} h1.big{font-size:42px} p{font-size:19px} .say{font-size:20px} .move span{font-size:21px}
}
</style>
</head>
<body>
<div class="bar"><div class="brand" id="brand">Dad of the Year</div><div class="count" id="count"></div></div>
<div class="dots" id="dots"></div>
<div class="stage" id="stage"><div class="track" id="track"></div></div>
<div class="nav"><button id="prev">Back</button><button id="next" class="next">Next</button></div>

<script>
/* ============================================================
   DECK DATA — replace this object per product. Card types:
   cover   {type:'cover', kicker, title, body}
   text    {type:'text', kicker, title, body:[...], say?, not?, move?}
   audio   {type:'audio', kicker, title, body, src, duration}
   end     {type:'end', kicker, title, body, links:[{label,href,style}]}
   Placeholder copy below is STRUCTURE ONLY — not in voice yet.
   ============================================================ */
const DECK = {
 "brand": "Dad of the Year",
 "title": "The Phone Talk",
 "slug": "phone",
 "cards": [
  {
   "type": "cover",
   "kicker": "The Phone Talk",
   "title": "Six cards for the talk about the phone.",
   "body": "Start with yours. Then pick the moment, ask before you tell, and agree on the plan together."
  },
  {
   "type": "text",
   "kicker": "1 of 6",
   "title": "Start with yours",
   "body": [
    "Before you talk to him about his phone, look at yours. In one study, parents on a phone were about five times less likely to answer a kid who needed them. The ones deep in it snapped at their kids more. Your screen time predicts his, more than anything you say. So this week, phone in the kitchen drawer from six to bedtime. Do that first. Then you've earned the talk."
   ],
   "audio": "/audio/phone/p01.mp3",
   "source": "Vanden Abeele et al. 2020, Cyberpsychology, Behavior, and Social Networking; Radesky et al. 2014, Pediatrics; Lauricella, Wartella & Rideout 2015, Journal of Applied Developmental Psychology (parent screen time predicts child screen time)."
  },
  {
   "type": "text",
   "kicker": "2 of 6",
   "title": "Pick the moment",
   "body": [
    "Not after a fight about the phone. Not at bedtime. A drive, a walk, the fire pit, somewhere you're side by side and nobody's looking at a screen. Say what it is up front: \"I want to talk about phones, yours and mine, and I want to hear your side.\" Keep it under fifteen minutes. If it goes long, that's a second talk, and that's fine."
   ],
   "audio": "/audio/phone/p02.mp3",
   "source": "AAP Council on Communications and Media 2016, Pediatrics (media-free times and places; parents distracted by media miss chances to connect)."
  },
  {
   "type": "text",
   "kicker": "3 of 6",
   "title": "Ask before you tell",
   "body": [
    "Start with questions. What do you use it for most? What's the best part? What's the part you don't like? Then say what worries you, plainly and once. A study followed three thousand kids. The ones whose parents explained the reason and asked their view used screens the least. The ones who got a lecture used them the most. The lecture is the one thing that makes it worse."
   ],
   "audio": "/audio/phone/p03.mp3",
   "source": "Bjelland et al. 2015, BMC Public Health (autonomy-supportive communication about screen rules; controlling delivery linked to more screen time)."
  },
  {
   "type": "text",
   "kicker": "4 of 6",
   "title": "Agree on the plan",
   "body": [
    "Write it down together. Three things cover most of it: no phones at dinner, no phones in bedrooms, and screens off an hour before bed. That's the pediatricians' plan, and it applies to you too.",
    "If he's under twelve and has no phone yet, the plan is simple: not yet, and here's when. If he's a teen, social media is the harder line, and you set it together with a date on it."
   ],
   "audio": "/audio/phone/p04.mp3",
   "source": "AAP 2016 Family Media Use Plan (media-free meals and bedrooms, no screens an hour before bed). The age lines follow Haidt, The Anxious Generation (2024), which is a framework, not settled science."
  },
  {
   "type": "text",
   "kicker": "5 of 6",
   "title": "Decide now what happens then",
   "body": [
    "He'll break it. Decide together, now, what happens the first time, so there's no yelling when it does. \"Phone goes in the drawer for the night, and we try again tomorrow.\" Calm, agreed, and the same every time. Then the first time he breaks it, you don't have to think, and you don't have to lose it."
   ],
   "audio": "/audio/phone/p05.mp3",
   "source": "Bjelland et al. 2015 (agreed rules kept better); the card ties to the deck's cards two and seven: no new rule gets made in the middle of a blow-up."
  },
  {
   "type": "text",
   "kicker": "6 of 6",
   "title": "Check back in two weeks",
   "body": [
    "Put a date on the calendar. In two weeks, ask him how it's going and tell him how you did with yours. Change one thing if one thing needs changing. Teens with rules they helped set keep them longer, and a kid who sees his dad keep the same rule learns the rule is real. Then it's not a fight. It's how your house works."
   ],
   "audio": "/audio/phone/p06.mp3",
   "source": "Bjelland et al. 2015; Lauricella et al. 2015 (parent habits predict child habits); Common Sense Media 2023 and 2025 for the numbers on teen notifications and screen hours, if a parent asks why it matters."
  },
  {
   "type": "end",
   "kicker": "Done",
   "title": "That's The Phone Talk.",
   "body": "Keep it on your phone. It's here the next time, and there's always a next time.",
   "links": [
    {
     "label": "Back to Dad Shift",
     "href": "/d/deck",
     "style": "gold"
    },
    {
     "label": "Send the assessment to a dad",
     "href": "https://doty.media/assessment",
     "style": "line"
    }
   ]
  }
 ]
};

/* ---------- render ---------- */
const track = document.getElementById('track'), dots = document.getElementById('dots');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const paras = b => (Array.isArray(b) ? b : [b]).map(x => `<p>${esc(x)}</p>`).join('');
function card(c, i){
  const pine = c.type === 'cover' || c.type === 'audio' || c.type === 'end';
  let h = `<div class="card"><div class="inner ${pine ? 'pine' : ''}">`;
  if (c.kicker) h += `<div class="kicker">${esc(c.kicker)}</div>`;
  if (c.type === 'cover'){
    h += `<img class="mark" src="/images/mono-sunrise.svg" alt=""><h1 class="big">${esc(c.title)}</h1>${paras(c.body)}<div class="hint">Swipe left, or tap Next</div>`;
  } else if (c.type === 'text'){
    h += `<h1>${esc(c.title)}</h1>${paras(c.body)}`;
    if (c.say) h += `<div class="say">${esc(c.say)}</div>`;
    if (c.not) h += `<div class="not"><b>Not this</b>${esc(c.not)}</div>`;
    if (c.move) h += `<div class="move"><b>The move</b><span>${esc(c.move)}</span></div>`;
    if (c.audio) h += `<div class="audio card-audio"><button class="play" data-src="${esc(c.audio)}"><span class="ico"><svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg></span><span class="lbl">Hear it</span></button><div class="aprog"><i></i></div><div class="atime"><span class="cur">0:00</span><span></span></div></div>`;
    if (c.source) h += `<details class="src"><summary>Where this comes from</summary><p>${esc(c.source)}</p></details>`;
  } else if (c.type === 'audio'){
    h += `<h1>${esc(c.title)}</h1>${paras(c.body)}
      <div class="audio"><button class="play" data-src="${esc(c.src)}"><span class="ico"><svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg></span><span class="lbl">Play</span></button>
      <div class="aprog"><i></i></div><div class="atime"><span class="cur">0:00</span><span>${esc(c.duration || '')}</span></div></div>`;
  } else if (c.type === 'end'){
    h += `<h1 class="big">${esc(c.title)}</h1>${paras(c.body)}<div class="not"><b>Keep it on your phone</b>iPhone: the share button, then Add to Home Screen. Android: the menu, then Add to Home screen.</div><div style="margin-top:auto">` +
      (c.links || []).map(l => `<a class="btn ${l.style || 'line'}" href="${esc(l.href)}">${esc(l.label)}</a>`).join('') + `</div>`;
  }
  return h + `</div></div>`;
}
track.innerHTML = DECK.cards.map(card).join('');
dots.innerHTML = DECK.cards.map(() => '<i></i>').join('');
document.getElementById('brand').textContent = DECK.brand;
document.title = DECK.title + ' — ' + DECK.brand;

/* ---------- navigation ---------- */
let i = 0; const n = DECK.cards.length;
/* open ping: the welcome email links here with ?s=<Kit subscriber id>; /api/open tags him as opened */
try { const sid = new URLSearchParams(location.search).get('s'); if (sid && /^\d+$/.test(sid)) { try { localStorage.setItem('doty_sid', sid); } catch(e){} fetch('/api/open?s=' + sid + '&d=' + (DECK.slug || 'deck'), {keepalive:true}).catch(()=>{}); } else { let saved=null; try { saved = localStorage.getItem('doty_sid'); } catch(e){} if (saved) fetch('/api/open?s=' + saved + '&d=' + (DECK.slug || 'deck'), {keepalive:true}).catch(()=>{}); } } catch(e){}
const prev = document.getElementById('prev'), next = document.getElementById('next'), count = document.getElementById('count');
function go(k){
  i = Math.max(0, Math.min(n - 1, k));
  track.style.transform = `translateX(-${i * 100}%)`;
  [...dots.children].forEach((d, j) => { d.className = j === i ? 'on' : (j < i ? 'done' : ''); });
  count.textContent = `${i + 1} / ${n}`;
  prev.disabled = i === 0; next.textContent = i === n - 1 ? 'Done' : 'Next';
  try { localStorage.setItem('doty-deck-' + DECK.title, i); } catch (e) {}
}
prev.onclick = () => go(i - 1);
next.onclick = () => { if (i < n - 1) go(i + 1); };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); });

/* swipe */
let sx = 0, sy = 0, dx = 0, dragging = false;
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; dragging = true; track.classList.add('drag'); }, {passive:true});
stage.addEventListener('touchmove', e => {
  if (!dragging) return;
  const mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
  if (Math.abs(my) > Math.abs(mx)) return;
  dx = mx; track.style.transform = `translateX(calc(-${i * 100}% + ${dx}px))`;
}, {passive:true});
stage.addEventListener('touchend', () => {
  dragging = false; track.classList.remove('drag');
  if (dx < -60) go(i + 1); else if (dx > 60) go(i - 1); else go(i);
});

/* audio */
let audio = null;
document.querySelectorAll('.play').forEach(btn => {
  const wrap = btn.parentElement, bar = wrap.querySelector('.aprog i'), cur = wrap.querySelector('.cur'), lbl = btn.querySelector('.lbl');
  btn.onclick = () => {
    if (!btn.dataset.src) { lbl.textContent = 'Audio coming'; return; }
    if (!audio || audio.src !== new URL(btn.dataset.src, location.href).href) { if (audio) audio.pause(); audio = new Audio(btn.dataset.src); audio.onerror = () => { lbl.textContent = 'Audio coming'; btn.classList.remove('playing'); }; audio.ontimeupdate = () => { bar.style.width = (audio.currentTime / audio.duration * 100) + '%'; const m = Math.floor(audio.currentTime / 60), s = Math.floor(audio.currentTime % 60); cur.textContent = `${m}:${String(s).padStart(2,'0')}`; }; audio.onended = () => { btn.classList.remove('playing'); lbl.textContent = 'Play again'; }; }
    if (audio.paused) { audio.play(); btn.classList.add('playing'); lbl.textContent = 'Playing'; } else { audio.pause(); btn.classList.remove('playing'); lbl.textContent = 'Resume'; }
  };
});

let start = 0; try { start = parseInt(localStorage.getItem('doty-deck-' + DECK.title) || '0', 10) || 0; } catch (e) {}
go(start);
</script>
</body>
</html>
