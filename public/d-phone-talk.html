<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#022822">
<title>The Phone Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="manifest" href="/manifest-phone-talk.webmanifest">
<link rel="apple-touch-icon" href="/images/pt-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phone Talk">
<link rel="icon" type="image/svg+xml" href="/images/mono-pine.svg">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#022822; --canvas:#F5F6E1; --sunrise:#FFB413; --campfire:#FF6B01;
  --trail:#006C4C; --meadow:#40CF77; --mist:#ACFFCC; --sand:#FFDD68;
  --surface:#022822; --raised:#0D3E36; --ink:#F5F6E1; --ink-2:rgba(245,246,225,.80); --ink-3:rgba(245,246,225,.68);
  --border:rgba(245,246,225,.16); --border-strong:rgba(245,246,225,.34); --accent:#FFB413; --eyebrow:#FF8A3D;
  --serif:"Libre Baskerville",Georgia,serif; --sans:"Inter",-apple-system,Helvetica,Arial,sans-serif; --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--pine);color:var(--canvas);font-family:var(--sans);overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 18px 10px}
.brand{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.count{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* progress */
.dots{display:flex;gap:5px;padding:0 18px 8px}
.dots i{flex:1;height:3px;border-radius:0;background:var(--border);transition:background .25s}
.dots i.on{background:var(--sunrise)}
.dots i.done{background:rgba(255,180,19,.45)}

/* stage */
.stage{position:relative;flex:1;overflow:hidden}
.track{position:absolute;inset:0;display:flex;transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
.track.drag{transition:none}
.card{flex:0 0 100%;height:100%;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);display:flex}
.inner{flex:1;background:var(--raised);color:var(--ink);border:1px solid var(--border);border-radius:0;padding:28px 24px 24px;display:flex;flex-direction:column;overflow:auto}
.inner.pine{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--eyebrow);margin:0 0 14px}
.inner.pine .kicker{color:var(--accent)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(24px,6.4vw,32px);line-height:1.18;margin:0 0 16px;letter-spacing:-.005em;color:var(--ink);text-wrap:balance}
h1.big{font-size:clamp(30px,8.4vw,40px);margin-top:auto}
p{font-size:clamp(16px,4.3vw,18px);line-height:1.5;margin:0 0 14px;color:var(--ink-2)}
p:last-child{margin-bottom:0}
.say{margin:18px 0 0;padding:16px 18px;border:1px solid var(--border);font-family:var(--serif);font-style:italic;font-size:clamp(17px,4.6vw,19px);line-height:1.45;color:var(--ink)}

.not{margin:14px 0 0;padding:14px 18px;border:1px solid var(--border);color:var(--ink-3);font-size:15px;line-height:1.45}
.not b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.move{margin-top:auto;padding-top:18px;border-top:1px solid var(--border)}
.move b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--meadow);margin-bottom:6px}
.move span{font-family:var(--serif);font-size:clamp(17px,4.6vw,20px);line-height:1.4}
.hint{margin-top:auto;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding-top:14px}

/* audio */
.audio{margin-top:auto}
.play{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--sunrise);color:var(--pine);border-radius:0;min-height:48px;padding:0 18px;font:500 15px var(--sans);cursor:pointer}
.play .ico{width:28px;height:28px;border-radius:999px;background:var(--pine);display:grid;place-items:center;flex:0 0 28px}
.play .ico svg{width:14px;height:14px;fill:var(--sunrise);margin-left:2px}
.play.playing .ico svg{margin-left:0}
.aprog{height:3px;border-radius:0;background:var(--border);margin:14px 0 0;overflow:hidden}
.aprog i{display:block;height:100%;width:0;background:var(--sunrise)}
.atime{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);margin-top:6px;font-variant-numeric:tabular-nums}

.card-audio{margin-top:18px}.card-audio .play{background:var(--sunrise);color:var(--pine)}.card-audio .play .ico{background:var(--pine)}.card-audio .play .ico svg{fill:var(--sunrise)}.card-audio .aprog{background:var(--border)}.card-audio .aprog i{background:var(--accent)}.card-audio .atime{color:var(--ink-3)}
.src{margin-top:14px;font-size:13px;color:var(--ink-3)}.src summary{cursor:pointer;color:var(--accent);font-family:var(--mono);font-weight:500;font-size:10px;letter-spacing:.16em;text-transform:uppercase}.src p{font-size:13px;line-height:1.45;margin:8px 0 0;color:var(--ink-3)}
/* links / buttons */
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;text-align:center;text-decoration:none;border-radius:0;padding:0 18px;font:500 14px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-top:10px}
.btn.gold{background:var(--sunrise);color:var(--pine)}
.btn.line{border:1px solid var(--border-strong);color:var(--ink)}
.mark{width:148px;height:auto;margin:0 0 20px;display:block}

/* nav */
.nav{display:flex;gap:10px;padding:0 16px calc(env(safe-area-inset-bottom) + 14px)}
.nav button{flex:1;border:1px solid var(--border-strong);border-radius:0;min-height:48px;padding:0 14px;font:500 14px var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--ink)}
.nav #prev{flex:0 0 104px}
.nav button.next{background:var(--sunrise);border-color:var(--sunrise);color:var(--pine)}
.nav button:disabled{opacity:.3}
@media (min-width:640px){
  body{align-items:center}
  .bar,.dots,.stage,.nav{width:430px}
  .stage{flex:0 0 auto;height:min(760px,calc(100dvh - 150px))}
}
@media (min-width:1024px){
  .bar,.dots,.stage,.nav{width:540px}
  .stage{height:min(820px,calc(100dvh - 150px))}
  h1{font-size:34px} h1.big{font-size:42px} p{font-size:19px} .say{font-size:20px} .move span{font-size:21px}
}

/* audio cards, 16 Nov */
.toc{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--border)}
.toc li{border-bottom:1px solid var(--border)}
.toc button{display:flex;align-items:baseline;gap:12px;width:100%;background:none;border:0;color:var(--ink);padding:13px 2px;font:400 16px/1.35 var(--sans);text-align:left;cursor:pointer;min-height:48px}
.toc .n{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:20px;font-variant-numeric:tabular-nums}
.toc .t{flex:1}
.toc .d{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.toc .ck{color:var(--meadow);font-size:12px;min-width:12px}
.steps{margin:6px 0 0;padding:0 0 0 20px}.steps li{font-size:clamp(16px,4.3vw,18px);line-height:1.5;color:var(--ink-2);margin:0 0 10px}
.player{position:sticky;top:-28px;z-index:2;background:var(--surface);margin:0 -24px 6px;padding:10px 24px 12px;border-bottom:1px solid var(--border)}
.prow{display:flex;gap:10px;align-items:stretch}
.prow .play{flex:1}
.skip{flex:0 0 56px;border:1px solid var(--border-strong);background:transparent;color:var(--ink);font:500 12px var(--mono);letter-spacing:.04em;cursor:pointer;min-height:48px}
.aprog{height:14px;background:none;margin:8px 0 0;position:relative;cursor:pointer;touch-action:none;overflow:visible}
.aprog::before{content:"";position:absolute;left:0;right:0;top:5px;height:4px;background:var(--border)}
.aprog i{position:absolute;left:0;top:5px;height:4px;width:0;background:var(--sunrise)}
.atime{margin-top:2px}
.barr{display:flex;align-items:center;gap:14px}
.all{background:none;border:0;padding:6px 0;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.play .ico .pa{display:none}.play.playing .ico .pl{display:none}.play.playing .ico .pa{display:block}
.read p{color:var(--ink-2)}
.read .next{font-family:var(--serif);font-style:italic;color:var(--accent);margin:22px 0 18px}
.read .mv{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--meadow);margin:22px 0 6px}
.read .mvp{color:var(--ink)}

</style>
</head>
<body>
<div class="bar"><div class="brand" id="brand">Dad of the Year</div><div class="barr"><button type="button" id="all" class="all" hidden>All cards</button><div class="count" id="count"></div></div></div>
<div class="dots" id="dots"></div>
<div class="stage" id="stage"><div class="track" id="track"></div></div>
<div class="nav"><button id="prev">Back</button><button id="next" class="next">Next</button></div>

<script>
/* The Phone Talk, six audio cards. Built 16 Nov 2026 by doty/site/build/build_phonetalk.py from voice/phonetalk3/final. */
const SLUG = 'phone-talk';
const CARDS = [{"k": "p01", "title": "Start with yours", "src": "/audio/phonetalk/p01.mp3", "dur": 100, "paras": ["It's 6:20pm and you're at the dinner table answering a work text. Your daughter is telling you about her science project. You say, \"Uh huh,\" and keep typing. She stops talking. Then she says, \"Dad. DAD.\" You look up. She's staring at your phone. \"You're not even listening.\"", "You feel like saying, \"It's work,\" and finishing the text.", "Her twelfth birthday is in two weeks, and her first phone is in a box in your closet.", "Here's what you do next...", "Start with yours. Do this for one week before you say a word to her about her phone.", "Pick a spot in the kitchen where phones go. A drawer works. Put a charger in it. From 6:00pm until she's in bed, your phone stays in that drawer. Tell the family what you're doing. \"I'm on my phone too much at night. From dinner until bedtime it stays in this drawer. If you catch me with it, call me on it.\"", "She will catch you. When she does, don't explain. Say, \"You're right. Thanks.\" Then put it back in the drawer.", "Some nights work can't wait. Say so out loud before you pick it up. \"I need to answer one work text. Give me two minutes.\" Answer it standing at the drawer, and put it back.", "You're about to ask her to leave her phone in the kitchen every night. Leave yours there overnight too. If it's your alarm, buy a ten dollar alarm clock.", "The first few nights, you'll reach for your pocket. You'll feel like checking your phone. Leave it in the drawer.", "At the end of the week, ask her how you did. \"How am I doing with the drawer?\" She says, \"Pretty good. You cheated on Tuesday.\" Don't argue. \"You got me. I'll do better this week.\""]}, {"k": "p02", "title": "Pick a calm time", "src": "/audio/phonetalk/p02.mp3", "dur": 81, "paras": ["Her birthday is a week away. You could hand her the box with the cake and tell her, \"We'll talk about rules later.\" Then one night you tell her to put it down. She's mad, you're tired, and you make up the rules on the spot.", "Here's what you do next...", "Pick a calm time. Have the talk before she ever turns the phone on. Do it this weekend, a week before her birthday. Don't do it right after an argument or at bedtime, and don't do it in front of your other kids.", "Go somewhere you can be side by side. Take a drive, go for a walk or sit by the fire pit.", "Ask her ahead of time so she knows it's coming. \"Saturday morning, you and me. We'll get donuts and take a walk. I want to talk to you about something.\" She looks worried. \"Am I in trouble?\" Tell her, \"No. It's good news.\"", "Plan on about half an hour for the walk and half an hour at the kitchen table when you get home.", "On Saturday, start with the good news. \"You're getting a phone for your birthday.\" She might scream or hug you. Let her enjoy it, and give her time.", "Then tell her how it's going to work. \"Before you turn it on, we're going to make a plan for it together. I want to hear what you think first. Then I'll tell you what worries me.\"", "Keep your own phone in your pocket the whole time. If it buzzes, leave it.", "If she rolls her eyes, let it go. If it turns into an argument, stop. \"Let's take a break. We'll finish this later.\""]}, {"k": "p03", "title": "Ask before you tell", "src": "/audio/phonetalk/p03.mp3", "dur": 107, "paras": ["You're on the walk, and she knows about the phone. You have a list of rules in your head. She's already looking at the ground.", "You feel like going through every rule.", "Here's what you do next...", "Ask before you tell. Start with three questions, and listen to every answer.", "\"What are you most excited to do with it?\" She smiles. \"Text my friends. And take pictures.\" Don't add a warning. Tell her, \"That sounds fun.\"", "\"What do your friends do on theirs?\" She says, \"Everybody's on Snapchat.\" Don't argue with it yet. Ask her, \"What do they like about it?\"", "\"Have you ever seen a phone cause a problem for somebody?\" She nods. \"A girl in my class isn't in the group chat anymore. They kicked her out, and she cried at lunch.\" Ask her one more. \"What do you think should've happened?\"", "If she goes quiet after a question, wait. Count to ten in your head before you say anything.", "Now it's your turn. Tell her what worries you. Say it once, and give her the reason. \"Here's what I worry about. Phones are hard to put down. They're hard for me too. I want you to get your sleep, and I want us to keep talking at dinner.\"", "Ask what she thinks. \"Does that sound right to you?\" She says, \"I guess.\" Ask her, \"What rules do you think we should have?\" She thinks about it. \"No phone until my homework's done?\" Tell her, \"I like that one.\" Remember what she says. You'll write it down when you get home.", "If she pushes back, hear her out. \"What do you mean?\" She may tell you, \"You're on yours all the time.\" Don't defend it. \"I was. That's why mine goes in the drawer now.\"", "If you catch yourself talking for a few minutes straight, stop and ask her a question.", "Before you head home, tell her one thing she did well. \"You told me what you think. I liked hearing it.\""]}, {"k": "p04", "title": "Write the plan together", "src": "/audio/phonetalk/p04.mp3", "dur": 108, "paras": ["You're back home at the kitchen table. She's told you what she thinks, and you've told her what worries you. Right now you both agree. A month from now she says, \"You never said that,\" and you can't remember if you did.", "Here's what you do next...", "Write the plan together. Get a sheet of paper and write it by hand. Put her rule from the walk on the first line. \"No phone until homework's done.\"", "Then add these rules.", "The phone stays in the kitchen at night. It goes on the charger in the drawer an hour before bed, every night. Tell her, \"Mine goes in there too. It's the same rule for both of us.\"", "No phones at the table. \"Every meal, and that goes for me too.\"", "At school it stays in her backpack.", "She asks before she downloads an app.", "No social media yet. Give her a date. \"We'll look at it again on your thirteenth birthday.\" She groans. \"Everyone has it, Dad.\" Tell her, \"I know. We'll look at it again when you're thirteen.\"", "Be kind on the phone. Bring up the girl from the group chat. \"Remember the girl who cried at lunch? If you wouldn't say it to somebody's face, don't send it. If a chat turns mean, leave it and come tell me.\"", "Some things she never sends. She doesn't send her address or the name of her school to anyone. She doesn't send a picture she wouldn't show you.", "Dad knows the passcode. \"I'm going to look at your phone sometimes. I won't sneak. When I look, you'll be sitting right next to me.\"", "Now ask her for a rule for you. She grins. \"No phone at my games.\" Write it down and stick to it.", "Read the page out loud. Then hand her the pen. \"Is anything on here unfair?\" Hear her out. Change what you can. Keep the kitchen rule, the app rule, the passcode and the date for social media.", "Leave room at the bottom of the page, and don't sign it yet."]}, {"k": "p05", "title": "Decide now what happens then", "src": "/audio/phonetalk/p05.mp3", "dur": 147, "paras": ["Picture a school night a month after her birthday. It's 9:40pm, and her phone isn't in the kitchen drawer. You open her door and see a glow under her blanket. She pretends to be asleep. Your jaw gets tight.", "You feel like taking the phone away for a month.", "Here's what you do next...", "Decide now what happens then. Do it at the kitchen table while you're both calm. Write it at the bottom of the plan.", "Agree on one thing that happens when she breaks a rule, and keep it small. \"If you break a rule on this page, the phone stays in the kitchen all the next day. After that we start fresh.\" Ask her, \"Does that seem fair?\" She nods. Write it on the page.", "Then make her a promise. \"If you ever see something that scares you, come get me. If somebody you don't know messages you, come get me. If anybody ever asks you for a picture, come get me. You won't be in trouble. You won't lose your phone for telling me, even if you broke a rule first.\"", "Have her say it back. \"What do you do if somebody you don't know asks how old you are?\" She says, \"Don't answer. Come get you.\" Ask her one more. \"Do you lose your phone?\" She shakes her head. \"No.\" Write the promise down too. Then you both sign the page and put it on the fridge.", "The night before her birthday, take the phone out of the box and set it up. On an iPhone, open Settings, tap Family and tap her name. On an Android, open the Family Link app. Turn on three things. Downtime shuts off her apps an hour before bed. The setting called Ask to Buy sends every download to you first. Family Link calls it app approvals. Content restrictions keep what she sees right for her age. Put the phone back in the box. On her birthday, hand it to her.", "When that school night comes, take a deep breath before you open her door. Keep your voice low. \"The phone was in your room. It stays in the kitchen tomorrow.\" Hold out your hand for it. Don't lecture, and don't add days because you're mad. When the day is up, hand it back and don't bring it up again.", "One day she'll walk into the kitchen holding her phone out. \"Dad, somebody I don't know sent me this.\" Keep your hands at your sides. Take a deep breath. Don't grab the phone. \"Thank you for telling me. You did the right thing.\"", "Look at it together. Don't delete anything. Block the account and report it in the app while she watches. If anybody threatens her or asks for money, don't pay. Report it at CyberTipline.org. When you're done, hand her phone back."]}, {"k": "p06", "title": "Check back after two weeks", "src": "/audio/phonetalk/p06.mp3", "dur": 105, "paras": ["She's had the phone for two weeks, and nothing has gone wrong. You figure the plan is working, and you stop thinking about it. A few months later her phone is in her room every night, and yours is back on the dinner table.", "Here's what you do next...", "Check back after two weeks. Put the date on the calendar the day you sign the plan, and tell her it's coming. \"Two weeks after your birthday, you and me. We'll see how it's going.\"", "Do it the way you did the first talk. Sit side by side, and keep your phone in your pocket.", "Ask her three questions.", "\"What's the best part of having it?\" She says, \"Sending pictures to my friends.\" Let her finish.", "\"Which rule is the hardest?\" She sighs. \"The kitchen one. My friends text at night and I miss stuff.\" Ask her, \"What do you miss?\" Listen. Then hold the rule. \"I know. It still stays in the kitchen at night. Tell your friends your phone goes off at eight.\"", "\"How am I doing with mine?\" Let her grade you. \"You checked it at my game on Saturday.\" Tell her, \"You're right. I'll fix that.\"", "Look through her phone together, the way you said you would. If you see something you don't like, keep your voice low. \"Tell me about this one.\" Listen before you decide anything.", "If a rule isn't working, change it together and write the change on the page. When she's kept a rule, give her more room and tell her why. \"You've put your phone in the drawer every night for two weeks. I'm proud of you. You've earned a new app. Pick one, and we'll look at it together.\"", "Between talks, notice if she's tired in the morning or quiet at dinner. Notice if she turns the screen away when you walk in. If something changes, don't wait for the date. Go sit next to her and ask.", "Set the next date before you get up. Once a month is enough from here. Look at social media again when she turns thirteen."]}];

  return `<div class="card"><div class="inner pine"><div class="kicker">Keep it on your phone</div>
    <h1 class="big" style="margin-top:0">Add The Phone Talk to your home screen</h1>
    <p>Tap the share button on an iPhone or the menu on an Android. Then tap Add to Home Screen.</p>
    <div style="margin-top:auto"><button type="button" class="btn line" data-go="0" style="width:100%;background:none;cursor:pointer">Back to all six</button></div>
  </div></div>`;
}
const track = document.getElementById('track'), dots = document.getElementById('dots');
track.innerHTML = cover() + CARDS.map(audioCard).join('') + endCard();
const n = CARDS.length + 2;
dots.innerHTML = Array.from({length: n}, () => '<i></i>').join('');
document.title = 'The Phone Talk';

/* open ping: the welcome email links here with ?s=<Kit subscriber id>; /api/open tags him as opened */
try { const sid = new URLSearchParams(location.search).get('s'); if (sid && /^\d+$/.test(sid)) { try { localStorage.setItem('doty_sid', sid); } catch(e){} fetch('/api/open?s=' + sid + '&d=' + SLUG, {keepalive:true}).catch(()=>{}); } else { let saved=null; try { saved = localStorage.getItem('doty_sid'); } catch(e){} if (saved) fetch('/api/open?s=' + saved + '&d=' + SLUG, {keepalive:true}).catch(()=>{}); } } catch(e){}

/* navigation */
let i = 0;
const prev = document.getElementById('prev'), next = document.getElementById('next'), count = document.getElementById('count');
function go(k){
  const was = i;
  i = Math.max(0, Math.min(n - 1, k));
  if (was !== i) stopAudio();
  track.style.transform = `translateX(-${i * 100}%)`;
  [...dots.children].forEach((d, j) => { d.className = j === i ? 'on' : (j < i ? 'done' : ''); });
  count.textContent = (i >= 1 && i <= CARDS.length) ? `${i} / ${CARDS.length}` : '';
  document.getElementById('all').hidden = i === 0;
  prev.disabled = i === 0; next.textContent = i === 0 ? 'Start with card 1' : (i === n - 1 ? 'Done' : 'Next');
}
prev.onclick = () => go(i - 1);
next.onclick = () => { go(i < n - 1 ? i + 1 : 0); };
document.getElementById('all').onclick = () => { go(0); };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); });
track.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) { go(parseInt(b.dataset.go, 10)); const inner = track.children[i].querySelector('.inner'); if (inner) inner.scrollTop = 0; } });

/* swipe */
let sx = 0, sy = 0, dx = 0, dragging = false, locked = false;
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', e => { if (e.target.closest('.aprog')) { dragging = false; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; dragging = true; locked = false; }, {passive:true});
stage.addEventListener('touchmove', e => {
  if (!dragging) return;
  const mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
  if (!locked) { if (Math.abs(mx) < 12 && Math.abs(my) < 12) return; if (Math.abs(my) > Math.abs(mx)) { dragging = false; return; } locked = true; track.classList.add('drag'); }
  dx = mx; track.style.transform = `translateX(calc(-${i * 100}% + ${dx}px))`;
}, {passive:true});
stage.addEventListener('touchend', () => {
  if (!dragging) return;
  dragging = false; track.classList.remove('drag');
  if (dx < -60) go(i + 1); else if (dx > 60) go(i - 1); else go(i);
  dx = 0;
});

/* audio: one player at a time, tap or drag the bar to move, 15 seconds either way */
let audio = null, live = null;
function ui(btn){ const p = btn.closest('.player'); return { p, bar: p.querySelector('.aprog i'), prog: p.querySelector('.aprog'), cur: p.querySelector('.cur'), lbl: btn.querySelector('.lbl') }; }
function stopAudio(){ if (audio && !audio.paused) { audio.pause(); if (live) { live.classList.remove('playing'); ui(live).lbl.textContent = 'Resume'; } } }
function load(btn){
  if (audio && live === btn) return;
  if (audio) { audio.pause(); if (live) { live.classList.remove('playing'); ui(live).lbl.textContent = 'Play'; } }
  const u = ui(btn); live = btn; audio = new Audio(btn.dataset.src); audio.preload = 'metadata';
  audio.onerror = () => { u.lbl.textContent = 'Audio did not load. Tap to try again'; btn.classList.remove('playing'); audio = null; live = null; };
  audio.ontimeupdate = () => { if (!audio || !audio.duration) return; u.bar.style.width = (audio.currentTime / audio.duration * 100) + '%'; u.cur.textContent = mmss(audio.currentTime); };
  audio.onended = () => { btn.classList.remove('playing'); u.lbl.textContent = 'Play again';
    const k = btn.closest('.inner').dataset.k; heard[k] = 1; try { localStorage.setItem('doty-phonetalk-heard', JSON.stringify(heard)); } catch (e) {}
    const ck = document.querySelector(`[data-ck="${k}"]`); if (ck) ck.innerHTML = '&#10003;'; };
  if ('mediaSession' in navigator) { try { navigator.mediaSession.metadata = new MediaMetadata({ title: btn.dataset.title, artist: 'The Phone Talk', album: 'Dad of the Year' }); } catch (e) {} }
}
track.addEventListener('click', e => {
  const btn = e.target.closest('.play');
  if (btn) { load(btn); const u = ui(btn);
    if (audio.paused) { audio.play().then(() => { btn.classList.add('playing'); u.lbl.textContent = 'Pause'; }).catch(() => { u.lbl.textContent = 'Tap to play'; }); }
    else { audio.pause(); btn.classList.remove('playing'); u.lbl.textContent = 'Resume'; }
    return; }
  const sk = e.target.closest('.skip');
  if (sk) { const b = sk.closest('.player').querySelector('.play'); if (audio && live === b && audio.duration) audio.currentTime = Math.max(0, Math.min(audio.duration - 0.2, audio.currentTime + parseInt(sk.dataset.skip, 10))); }
});
function seek(prog, clientX){ const b = prog.closest('.player').querySelector('.play'); if (!audio || live !== b || !audio.duration) return; const r = prog.getBoundingClientRect(); audio.currentTime = Math.max(0, Math.min(1, (clientX - r.left) / r.width)) * (audio.duration - 0.2); }
track.addEventListener('pointerdown', e => { const pr = e.target.closest('.aprog'); if (!pr) return; seek(pr, e.clientX); const mv = ev => seek(pr, ev.clientX); const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); }; window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); });

go(0);
</script>
</body>
</html>
